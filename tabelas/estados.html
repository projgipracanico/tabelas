<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>

    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        table{
            width: 500px;
            border-collapse: collapse;
        }
        td, th{
            border: 1px solid black; 
            padding: 10px;

        }
        caption{
            font-size: 22px;
            font-weight: bold;
            padding: 10px;
            background-color: lightgrey;
        }
        thead,tfoot{
            background-color: grey;
            color: white;
        }
        tbody > tr:nth-child(odd){
            background-color: white;
        }
        tbody> tr:nth-child(even){
            background-color: lightgray;
        }
        td.num{
            text-align: right;
        }


    </style>
</head>
<body>
    <h1>ESTRUTURAS DE TABELAS GRANDES</h1>

    <Table>
        <CAPtion>POPULAÇÃO DOS ESTADOS</CAPtion>
        <th>
            <tr>
                <th colspan="2">SUDESTE</th>
            </tr>

            <tr>
                <th>Estado</th>
                <th style="width: 50px;">Quantidade</th>
            </tr>
        </th>

        <tbody>
            <tr>
                <td>São Paulo</td>
                <td class="num">44milhões</td>
            </tr>
            <tr>
                <td>Minas Gerais</td>
                <td class="num">20milhões</td>
            </tr>
            <tr>
                <td>Rio de Janeiro</td>
                <td class="num">16milhões</td>
            </tr>
            <tr>
                <td>Espírito Santo</td>
                <td class="num">4milhões</td>
            </tr>

        </tbody>

        <tfoot>
            <tr>
                <th>Total de Habitantes</th>
                <td class="num"> <strong>84milhões</strong></td>
            </tr>
        </tfoot>
    </Table>
</body>
</html>
